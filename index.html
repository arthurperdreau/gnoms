<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gnomads algorithm simulator: place your gnome, build an algorithm with cards and see where it ends up.">
  <title>Gnomads Simulator</title>
  <link rel="icon" href="assets/icons/gnome.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/cards.css">
</head>
<body>
  <header class="app-header">
    <img class="app-header__logo" src="assets/icons/gnome.svg" alt="" width="32" height="32">
    <!-- Text is injected from js/i18n.js by main.js -->
    <h1 class="app-header__title" data-i18n="appTitle">Gnomads Simulator</h1>
  </header>

  <main class="app">
    <!-- ===== Board ===== -->
    <section class="panel panel--board" aria-labelledby="board-title">
      <h2 id="board-title" class="visually-hidden" data-i18n="boardTitle">Board</h2>
      <!-- 121 cells are generated by js/ui/boardView.js -->
      <div id="board" class="board" role="group" aria-label="Board"></div>
    </section>

    <!-- ===== Toolbar: edit modes ===== -->
    <section class="panel panel--toolbar" aria-labelledby="toolbar-title">
      <h2 id="toolbar-title" class="panel__title" data-i18n="toolbarTitle">Edit board</h2>
      <div id="toolbar" class="toolbar" role="radiogroup">
        <button type="button" class="btn btn--mode" data-mode="gnome" role="radio" aria-checked="true" data-i18n="modeGnome">Place gnome</button>
        <button type="button" class="btn btn--mode" data-mode="wall" role="radio" aria-checked="false" data-i18n="modeWall">Walls</button>
        <button type="button" class="btn btn--mode" data-mode="direction" role="radio" aria-checked="false" data-i18n="modeDirection">Direction</button>
      </div>
      <!-- Shown only when the "direction" mode is active -->
      <div id="direction-picker" class="direction-picker" hidden>
        <button type="button" class="btn btn--dir" data-direction="N" aria-label="North">↑</button>
        <button type="button" class="btn btn--dir" data-direction="W" aria-label="West">←</button>
        <button type="button" class="btn btn--dir" data-direction="E" aria-label="East">→</button>
        <button type="button" class="btn btn--dir" data-direction="S" aria-label="South">↓</button>
      </div>
    </section>

    <!-- ===== Card palette ===== -->
    <section class="panel panel--palette" aria-labelledby="palette-title">
      <h2 id="palette-title" class="panel__title" data-i18n="paletteTitle">Cards</h2>
      <!-- Level filter buttons are generated by js/ui/paletteView.js -->
      <div id="level-filter" class="level-filter" role="radiogroup"></div>
      <ul id="palette" class="palette"></ul>
    </section>

    <!-- ===== Algorithm ===== -->
    <section class="panel panel--program" aria-labelledby="program-title">
      <div class="panel__header">
        <h2 id="program-title" class="panel__title" data-i18n="programTitle">Algorithm</h2>
        <span id="card-counter" class="card-counter" aria-live="polite">0 / 5</span>
      </div>
      <div id="program-target" class="program-target">
        <span id="program-target-label"></span>
        <button type="button" id="btn-root" class="btn btn--small" data-i18n="backToMain" hidden>Back to main level</button>
      </div>
      <ol id="program" class="program"></ol>
    </section>

    <!-- ===== Run controls ===== -->
    <section class="panel panel--controls" aria-labelledby="controls-title">
      <h2 id="controls-title" class="visually-hidden" data-i18n="controlsTitle">Controls</h2>
      <div class="controls">
        <button type="button" id="btn-run" class="btn btn--primary" data-i18n="run">Run</button>
        <button type="button" id="btn-step" class="btn" data-i18n="step">Step</button>
        <button type="button" id="btn-reset" class="btn" data-i18n="resetGnome">Reset gnome</button>
        <button type="button" id="btn-clear" class="btn btn--danger" data-i18n="clearProgram">Clear</button>
        <button type="button" id="btn-clear-walls" class="btn btn--danger" data-i18n="clearWalls">Clear walls</button>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
