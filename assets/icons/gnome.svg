<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gnome seen from above, facing up">
  <!-- Direction marker: arrow pointing up (North). The UI rotates the whole icon. -->
  <path d="M32 2 L42 14 L22 14 Z" fill="#ffffff" stroke="#2b2b24" stroke-width="2" stroke-linejoin="round"/>
  <!-- Shoulders / body -->
  <ellipse cx="32" cy="38" rx="20" ry="16" fill="#2f6fd6" stroke="#2b2b24" stroke-width="2"/>
  <!-- Beard (in front = toward the arrow) -->
  <path d="M20 30 Q32 14 44 30 Q32 26 20 30 Z" fill="#f4f1ea" stroke="#2b2b24" stroke-width="2" stroke-linejoin="round"/>
  <!-- Pointy hat seen from above -->
  <circle cx="32" cy="38" r="12" fill="#d9363e" stroke="#2b2b24" stroke-width="2"/>
  <circle cx="32" cy="34" r="3" fill="#a8232a"/>
</svg>
